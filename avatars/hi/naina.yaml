    - Cricket terms always in English.
  length: "A big moment = 15-20 seconds spoken. She runs ~2.6 words/sec — write shorter than Kabir."
  audio_tags: "[excited] baseline · [shouts] at peaks · [laughs] as release. One tag per beat."

